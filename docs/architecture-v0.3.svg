<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Serving Verdict v0.3 architecture</title><desc id="desc">Browser wizard talks to loopback FastAPI and an ephemeral job manager, which runs bounded benchmarks against a loopback OpenAI endpoint and feeds evidence tools.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>.box{rx:8;stroke-width:1.5}.t{fill:#f8fafc;font-size:13px;font-weight:700}.s{fill:#94a3b8;font-size:10px}.line{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}.dash{stroke:#fb7185;stroke-dasharray:6 5;fill:none}.front{fill:#082f49;stroke:#22d3ee}.back{fill:#064e3b;stroke:#34d399}.data{fill:#4c1d95;stroke:#a78bfa}.sec{fill:#881337;stroke:#fb7185}.ext{fill:#1e293b;stroke:#94a3b8}.amber{fill:#78350f;stroke:#fbbf24}</style></defs>
<rect width="1200" height="680" fill="url(#grid)"/><rect x="25" y="25" width="950" height="620" rx="16" class="dash"/><text x="45" y="51" fill="#fb7185" font-size="11">LOOPBACK TRUST BOUNDARY · 127.0.0.1</text>
<path class="line" d="M210 125H300"/><path class="line" d="M500 125H585"/><path class="line" d="M785 125H1010"/><path class="line" d="M685 170V230"/><path class="line" d="M685 320V370"/><path class="line" d="M275 455H350"/><path class="line" d="M565 455H640"/><path class="line" d="M855 455H930"/><path class="line" d="M760 530V580H510"/>
<g><rect x="45" y="85" width="165" height="80" class="box front"/><text x="65" y="116" class="t">Automation Wizard</text><text x="65" y="136" class="s">self-contained HTML/JS/CSS</text><text x="65" y="151" class="s">progress · cancel · safe result</text></g>
<g><rect x="300" y="85" width="200" height="80" class="box back"/><text x="320" y="116" class="t">Loopback FastAPI</text><text x="320" y="136" class="s">strict endpoint payloads</text><text x="320" y="151" class="s">bundle/trial APIs read-only</text></g>
<g><rect x="585" y="85" width="200" height="80" class="box back"/><text x="605" y="116" class="t">Ephemeral JobManager</text><text x="605" y="136" class="s">one active · bounded history</text><text x="605" y="151" class="s">cooperative result discard</text></g>
<g><rect x="1010" y="85" width="165" height="80" class="box ext"/><text x="1030" y="116" class="t">OpenAI Endpoint</text><text x="1030" y="136" class="s">loopback target only</text><text x="1030" y="151" class="s">secret from server env</text></g>
<g><rect x="565" y="230" width="240" height="90" class="box amber"/><text x="585" y="261" class="t">Frozen Quick Runner</text><text x="585" y="281" class="s">warmup · serial · concurrency</text><text x="585" y="298" class="s">TTFT · decode · tool · quality</text></g>
<g><rect x="70" y="400" width="205" height="110" class="box back"/><text x="90" y="430" class="t">Doctor + Capacity</text><text x="90" y="451" class="s">GPU/driver/memory facts</text><text x="90" y="468" class="s">KV/context/concurrency fit</text><text x="90" y="485" class="s">FIT · RISK · NO_FIT</text></g>
<g><rect x="350" y="400" width="215" height="110" class="box back"/><text x="370" y="430" class="t">Config Advisor</text><text x="370" y="451" class="s">rule-based recommendations</text><text x="370" y="468" class="s">allowlisted inert argv</text><text x="370" y="485" class="s">experiment + rollback</text></g>
<g><rect x="640" y="400" width="215" height="110" class="box data"/><text x="660" y="430" class="t">Compare + Pareto</text><text x="660" y="451" class="s">comparability first</text><text x="660" y="468" class="s">seeded one-variable sweep</text><text x="660" y="485" class="s">no fabricated winner</text></g>
<g><rect x="930" y="400" width="215" height="110" class="box sec"/><text x="950" y="430" class="t">Replay + CI Gate</text><text x="950" y="451" class="s">keyed fingerprints only</text><text x="950" y="468" class="s">PASS · FAIL · INCONCLUSIVE</text><text x="950" y="485" class="s">raw prompts not persisted</text></g>
<g><rect x="300" y="565" width="210" height="60" class="box data"/><text x="320" y="592" class="t">Sealed Artifacts</text><text x="320" y="610" class="s">canonical digest + provenance</text></g>
<g><rect x="565" y="565" width="210" height="60" class="box data"/><text x="585" y="592" class="t">Verdict Engine</text><text x="585" y="610" class="s">PROMOTE · REJECT · INCONCLUSIVE</text></g>
<g><rect x="830" y="565" width="120" height="60" class="box data"/><text x="850" y="592" class="t">History</text><text x="850" y="610" class="s">append-only</text></g>
</svg>