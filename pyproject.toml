[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-serve-verdict"
version = "0.4.0"
description = "Local-first, evidence-driven PROMOTE/REJECT/INCONCLUSIVE decisions for LLM serving changes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Inference Engineering Studio" }]
keywords = [
    "inference-serving",
    "benchmarking",
    "reproducibility",
    "decision-gates",
    "llm-ops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "cryptography>=42.0",
]

[project.urls]
Homepage = "https://github.com/ozkangrk/llm-serve-verdict"
Repository = "https://github.com/ozkangrk/llm-serve-verdict"
Issues = "https://github.com/ozkangrk/llm-serve-verdict/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
llm-serve-verdict = "serving_verdict.cli:main"
serving-verdict = "serving_verdict.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/serving_verdict"]

# NOTE: no force-include for the web/ assets. The wheel builder already
# includes every file inside the serving_verdict package (including
# serving_verdict/web/*); forcing the same directory again makes hatchling
# add serving_verdict/web/__init__.py twice and abort the build.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["serving_verdict"]
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "quickjs>=1.19.4",
]
