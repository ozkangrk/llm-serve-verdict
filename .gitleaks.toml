title = "LLM ServeVerdict gitleaks configuration"

[extend]
useDefault = true

# Gitleaks' generic-api-key rule treats typed Python field/function declarations
# containing `private_key` as credentials. Suppress only the exact declaration
# shapes in the two signing-contract files; values, assignments and all other
# rules/paths remain fully scanned.
[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
description = "Typed Ed25519 declarations are identifiers, not embedded keys"
condition = "AND"
regexTarget = "match"
paths = [
  '''^src/serving_verdict/signing\.py$''',
  '''^tests/helpers_v04_bundle\.py$''',
]
regexes = [
  '''^private_key:\s*Ed25519PrivateKey\s*$''',
  '''^key:\s*Ed25519PrivateKey\s*$''',
  '''^key:\s*Ed25519PrivateKey\s*\|\s*Ed25519PublicKey\s*$''',
]

  [[rules.allowlists]]
description = "Known inference workload IDs are not API keys"
condition = "AND"
regexTarget = "match"
paths = ['''^tests/test_adapters\.py$''']
regexes = [
  '''^aggregate_output_tokens_per_s", "concurrency4_(short_256|ctx_128|long_512)"$''',
]

  [[rules.allowlists]]
description = "Dedicated redaction-test sentinel constants"
condition = "AND"
regexTarget = "match"
paths = [
  '''^tests/test_workload\.py$''',
  '''^tests/test_replay\.py$''',
  '''^tests/test_replay_gate\.py$''',
]
regexes = ['''^SECRET\s*=\s*"sk-[^"]+"$''']
