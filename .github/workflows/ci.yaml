name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@f94ec6bedd8674c4426838e6b50417d36b6ab231 # v5.3.1
        with:
          version: "0.7"
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Create environment (uv)
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}

      - name: Run test suite (pytest)
        run: uv run --frozen pytest -q

      - name: Lint (ruff)
        run: uv run --frozen ruff check src tests

      - name: Type check (mypy)
        run: uv run --frozen mypy src

      - name: Validate workflows (pinning, least permissions, contracts)
        run: uv run --frozen python scripts/check_workflows.py

      - name: Build distributions (sdist + wheel)
        run: uv build

      - name: Verify built wheel imports
        run: |
          uv venv /tmp/wheel-venv --python ${{ matrix.python }}
          uv pip install --python /tmp/wheel-venv/bin/python dist/*.whl
          /tmp/wheel-venv/bin/python -c "import importlib.metadata as m, serving_verdict as s; assert s.__version__ == m.version('llm-serve-verdict'), (s.__version__, m.version('llm-serve-verdict'))"
