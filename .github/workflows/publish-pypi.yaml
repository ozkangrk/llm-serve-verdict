# PyPI publish — guarded and manual by design.
#
# This workflow NEVER runs on push/pull_request. It is triggered only:
#   1. manually from the Actions tab ("Run workflow"), or
#   2. by a push to a v* tag, and only if the repository is configured for
#      trusted publishing (see steps below for what that requires).
#
# Trusted publishing setup (owner must do this once, in the PyPI UI):
#   1. Create a publishing pipeline for `llm-serve-verdict` in the PyPI account.
#   2. Configure a GitHub OIDC identity:
#        issuer:    https://token.actions.githubusercontent.com
#        subject:   repository:ozkangrk/llm-serve-verdict
#   3. In GitHub repo Settings -> Developer settings -> OIDC, add the PyPI
#      audience:  https://pypi.org
#   Once that exists, the `publish` job below needs NO secrets: the
#      `pyproject.toml` + `version` gates plus the tag check are the only
#      guards, and the OIDC token is issued per-run.
#
# Until trusted publishing is configured, the publish step fails fast with a
# clear error instead of silently doing nothing — and no workflow secrets are
# required or referenced anywhere in this repository.

name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match pyproject.toml exactly, e.g. 0.3.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # only needed for trusted publishing; harmless otherwise

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  gates:
    name: Pre-publish gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@f94ec6bedd8674c4426838e6b50417d36b6ab231 # v5.3.1
        with:
          version: "0.7"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create environment (uv)
        run: uv sync --frozen --extra dev --python 3.12

      - name: Determine the version to publish
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${REQUESTED_VERSION}" ]; then
            if [[ ! "${REQUESTED_VERSION}" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
              echo "::error::manual version has an invalid format"
              exit 2
            fi
            version="${REQUESTED_VERSION}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "manual dispatch: publishing version $version"
          else
            version="${GITHUB_REF_NAME#v}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag trigger: publishing version $version"
          fi

      - name: Verify version matches pyproject.toml
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="$([ -n "${REQUESTED_VERSION}" ] && printf '%s' "${REQUESTED_VERSION}" || printf '%s' "${GITHUB_REF_NAME#v}")"
          actual="$(uv run --frozen python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$version" != "$actual" ]; then
            echo "::error::requested version $version does not match pyproject.toml ($actual)"
            exit 1
          fi
          echo "version gate passed: $version"

      - name: Verify clean working tree
        run: git diff --exit-code HEAD

      - name: Run test suite (pytest)
        run: uv run --frozen pytest -q

      - name: Lint (ruff)
        run: uv run --frozen ruff check src tests

      - name: Type check (mypy)
        run: uv run --frozen mypy src

      - name: Build distributions
        run: uv build

      - name: Verify built wheel imports
        run: |
          uv venv /tmp/wheel-venv --python 3.12
          uv pip install --python /tmp/wheel-venv/bin/python dist/*.whl
          /tmp/wheel-venv/bin/python -c "import importlib.metadata as m, serving_verdict as s; assert s.__version__ == m.version('llm-serve-verdict'), (s.__version__, m.version('llm-serve-verdict'))"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-publish
          path: dist/

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: gates
    if: needs.gates.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-publish
          path: dist/

      # No `password` input on purpose: pypa/gh-action-pypi-publish uses
      # GitHub's built-in PyPI trusted publishing (OIDC) when no password
      # is given. If trusted publishing is not yet configured, it fails
      # with a clear error and the release can be retried after setup.
      #
      # Pinned to the v1.14.2 commit SHA (verified against the official
      # pypa/gh-action-pypi-publish repository on 2026-08-20) instead of a
      # floating tag. If a newer release is adopted, re-verify the SHA and
      # update both this file and PINNED_REFS in scripts/check_workflows.py.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
