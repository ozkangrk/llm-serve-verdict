name: Secret Scan

# Full-repository-history secret scanning (RR-3). The official gitleaks binary
# is version-pinned and verified against its release SHA-256 before execution.
# `--log-opts=--all` scans every reachable commit, including secrets removed in
# later commits. Least privilege: read contents only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.3"
  GITLEAKS_LINUX_X64_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history for scan)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install checksum-verified gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          printf '%s  %s\n' "${GITLEAKS_LINUX_X64_SHA256}" "${RUNNER_TEMP}/${archive}" \
            | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" \
            --directory "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version

      - name: Scan every reachable commit
        shell: bash
        run: >-
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner --exit-code=2
          --config=.gitleaks.toml --log-opts=--all .
