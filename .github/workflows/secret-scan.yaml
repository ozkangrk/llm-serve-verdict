name: Secret Scan

# Secret scanning (RR-3) with gitleaks. Runs gitleaks over the full clone
# (default for this action since v2.2: `full-fetch`), failing the workflow
# on any high-confidence finding. Least-privilege: read contents only —
# the action does not need write access to report findings.
#
# Pinned to a commit SHA verified against gitleaks/gitleaks-action
# (v2.3.9, tag object resolved via the official repository on 2026-08-20).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history for scan)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
