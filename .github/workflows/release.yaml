name: Release

# Tag-triggered release. Produces wheel + sdist, a SHA256SUMS file covering
# both artifacts, and GitHub artifact provenance attestations (DSSE
# attestations for the release assets, generated by GitHub via
# actions/attest-build-provenance).
#
# Claim boundary (deliberately narrow — do not expand without evidence):
# - This produces GitHub *artifact attestation* for the release assets.
#   This is NOT a Sigstore/cosign signature and NOT an OIDC identity claim
#   about the signer beyond what GitHub's attestation service provides.
# - The build is NOT reproducible bit-identical across machines/toolchains:
#   sdist/wheel metadata embeds timestamps and the toolchain can differ.
#   Verification is by SHA256SUMS (integrity) + provenance attestation
#   (linkage to the source commit and build job), not by rebuilding.
#
# All third-party actions are pinned to commit SHAs verified against their
# official repositories (see scripts/check_workflows.py, PINNED_REFS).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release + assets
  id-token: write # required by actions/attest-build-provenance

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@f94ec6bedd8674c4426838e6b50417d36b6ab231 # v5.3.1
        with:
          version: "0.7"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create environment (uv)
        run: uv sync --frozen --extra dev --python 3.12

      - name: Verify tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run --frozen python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match pyproject version $version"
            exit 1
          fi
          echo "tag/version match: v$tag"

      - name: Run test suite (pytest)
        run: uv run --frozen pytest -q

      - name: Lint (ruff)
        run: uv run --frozen ruff check src tests

      - name: Type check (mypy)
        run: uv run --frozen mypy src

      - name: Validate workflows (pinning, least permissions, contracts)
        run: uv run --frozen python scripts/check_workflows.py

      - name: Build distributions (sdist + wheel)
        run: uv build

      - name: Verify built wheel imports
        run: |
          uv venv /tmp/wheel-venv --python 3.12
          uv pip install --python /tmp/wheel-venv/bin/python dist/*.whl
          /tmp/wheel-venv/bin/python -c "import importlib.metadata as m, serving_verdict as s; assert s.__version__ == m.version('serving-verdict'), (s.__version__, m.version('serving-verdict'))"

      - name: Verify both artifacts were produced
        run: |
          ls dist/*.whl dist/*.tar.gz
          test "$(ls dist/*.whl)" != ""
          test "$(ls dist/*.tar.gz)" != ""

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts (dist + SHA256SUMS)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Attest build provenance (GitHub artifact attestation)
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          show-summary: true

  publish:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Create GitHub release with assets
        uses: softprops/action-gh-release@aec2ec56f94eb8180ceec724245f64ef008b89f5 # v2.4.0
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
